name: Platform Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  platform_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["", "stable"]
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runner: xvfb-run
            tags: ci
          - os: macos-latest
            tags: ci

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: "go.mod"

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bc clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev libwayland-dev libxkbcommon-dev bc libpam-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"
        if: ${{ runner.os == 'Linux' }}

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8
        if: ${{ runner.os == 'Linux' }}

      # The Wayland compositor links wlroots 0.20, which the runners do not
      # package: it is tested by the compositor job of static_analysis.yml.
      - name: List packages
        shell: bash
        run: go list ./... | grep -v -e /cmd/tyde_compositor -e /internal/wayland/compositor -e /internal/wayland/wlr > "$RUNNER_TEMP/pkgs"

      - name: Tests
        shell: bash
        run: ${{ matrix.runner }} go test -tags "${{ matrix.tags }}" -covermode=atomic -coverprofile=coverage.out $(cat "$RUNNER_TEMP/pkgs")

      - name: Wayland Tests
        run: go test -tags no_glfw,ci,wayland $(cat "$RUNNER_TEMP/pkgs")
        if: ${{ runner.os == 'Linux' }}

      - name: Update coverage
        run: |
          set -e
          coverage=`go tool cover -func coverage.out | grep total | tr -s '\t' | cut -f 3 | grep -o '[^%]*'`
          if (( $(echo "$coverage < 12.5" | bc) )); then echo "Test coverage lowered to $coverage"; exit 1; fi
        if: ${{ runner.os == 'Linux' && matrix.go-version == 'stable' }}

      - name: Update PR Coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
        if: ${{ runner.os == 'Linux' && matrix.go-version == 'stable' }}
