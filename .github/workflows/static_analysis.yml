name: Static Analysis
on: [push, pull_request]
permissions:
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang lld libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev bc libpam-dev xvfb language-pack-en

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8

      - name: Install analysis tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install lucor.dev/lian@latest

      # The Wayland compositor links wlroots 0.20, which ubuntu-latest does
      # not package: it is checked by the compositor job below.
      - name: List packages
        run: go list ./... | grep -v -e /cmd/tyde_compositor -e /internal/wayland/compositor -e /internal/wayland/wlr > "$RUNNER_TEMP/pkgs"

      - name: Vet
        run: go vet $(cat "$RUNNER_TEMP/pkgs")

      - name: Formatting
        run: |
          gofumpt -d -e .
          test -z "$(goimports -e -d . | tee /dev/stderr)"

      # The compositor's wlroots event handlers are still to be split up; until
      # then they are left out of the complexity check.
      - name: Gocyclo
        run: gocyclo -over 30 -ignore "internal/wayland/compositor/" .

      - name: Staticcheck
        run: staticcheck $(cat "$RUNNER_TEMP/pkgs")

  # The Wayland compositor needs wlroots 0.20 (pkg-config: wlroots-0.20),
  # packaged in Debian forky/sid but not on ubuntu-latest: build, vet and test
  # it in a Debian sid container.
  compositor:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Get dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc pkg-config \
            libwlroots-0.20-dev xkb-data libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev xorg-dev libpam0g-dev

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build ./cmd/tyde_compositor/

      - name: Vet
        run: go vet ./cmd/tyde_compositor/ ./internal/wayland/compositor/ ./internal/wayland/wlr/...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./cmd/tyde_compositor/ ./internal/wayland/compositor/ ./internal/wayland/wlr/...

      - name: Test wlroots layer
        run: go test -race ./internal/wayland/wlr/...
