name: Static Analysis
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Get dependencies
      run: |
        sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
        go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Cleanup repository
      run: rm -rf vendor/

    # CRITICAL: Never use "go vet ./..." or "go list ./..." — compiles
    # cmd/compositor/ which requires wlroots CGO and will fail.
    # Note: cmd/fynedesk/ excluded until modules/notifications is created.
    - name: Vet
      run: |
        go vet -tags ci \
          ./cmd/fynedesk_runner/ \
          ./cmd/fynedesk-panel/ \
          ./cmd/fynedesk-ctl/ \
          ./internal/ui/ \
          ./internal/icon/ \
          ./internal/x11/... \
          ./modules/... \
          ./theme/ \
          ./wm/ \
          ./wlipc/ \
          ./test/

    - name: Goimports
      run: test -z "$(goimports -e -d . | tee /dev/stderr)"

    - name: Gocyclo
      # Advisory: reports complex functions but doesn't fail CI.
      # Compositor input/IPC handlers are inherently complex (>25).
      continue-on-error: true
      run: gocyclo -over 25 .

    - name: Staticcheck
      run: |
        staticcheck \
          ./cmd/fynedesk_runner/ \
          ./cmd/fynedesk-panel/ \
          ./cmd/fynedesk-ctl/ \
          ./internal/ui/ \
          ./internal/icon/ \
          ./internal/x11/... \
          ./modules/... \
          ./theme/ \
          ./wm/ \
          ./wlipc/ \
          ./test/
